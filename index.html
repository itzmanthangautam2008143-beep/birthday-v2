<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Priya ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Loading Screen -->

<div id="loader">

    <h1 class="loader-title">
        Happy Birthday
    </h1>

    <p class="loader-text">
        Preparing a Special Surprise...
    </p>

</div>

<!-- Background -->

<div id="background"></div>

<!-- Floating Hearts -->

<div id="hearts"></div>

<!-- Main Content -->

<div id="main">

    <h1 id="title">
        Happy Birthday Priya ❤️
    </h1>

    <p id="subtitle">

        May your smile always shine brighter than the stars.

    </p>

    <div id="photo-frame">

        <img
            id="photo"
            src="assets/1.jpg"
            alt="Priya">

    </div>

    <button id="playBtn">

        🎁 Open Your Surprise

    </button>

    <audio id="music">

        <source
        src="assets/music.mp3"
        type="audio/mpeg">

    </audio>

</div>

<!-- Fireworks Canvas -->

<canvas id="fireworks"></canvas>

<script src="script.js"></script>

</body>

</html>
